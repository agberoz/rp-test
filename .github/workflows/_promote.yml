# Reusable: open (or refresh) a promotion PR from one branch to the next.
# The PR description lists the release tags and commits that `source` has
# and `target` does not yet have.
name: _promote

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      target:
        type: string
        required: true
      auto_merge:
        description: Enable GitHub auto-merge (still waits for required approvals/checks).
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      # A PAT / GitHub App token is needed so the PR and its merge trigger
      # downstream workflows; GITHUB_TOKEN events do not trigger new runs.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      SOURCE: ${{ inputs.source }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Compute changes
        id: diff
        run: |
          git fetch --tags origin "$SOURCE" "$TARGET"
          ahead=$(git rev-list --count "origin/$TARGET..origin/$SOURCE")
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          if [ "$ahead" -eq 0 ]; then
            echo "$TARGET is up to date with $SOURCE; nothing to promote."
            exit 0
          fi

          tags=$(git tag --merged "origin/$SOURCE" --no-merged "origin/$TARGET" --sort=-v:refname)
          latest=$(echo "$tags" | head -n1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "## Promote \`$SOURCE\` → \`$TARGET\`"
            echo
            echo "### Releases"
            if [ -z "$tags" ]; then
              echo "_No new release tags._"
            else
              for tag in $tags; do
                echo "- [\`$tag\`]($repo_url/releases/tag/$tag)"
              done
              echo
              for tag in $tags; do
                notes=$(gh release view "$tag" --json body -q .body 2>/dev/null || true)
                [ -n "$notes" ] || continue
                echo "<details><summary>$tag release notes</summary>"
                echo
                echo "$notes"
                echo
                echo "</details>"
              done
            fi
            echo
            echo "### Commits ($ahead)"
            git log --no-merges --format='- %h %s' "origin/$TARGET..origin/$SOURCE" | head -n 100
          } > pr-body.md

      - name: Create or update PR
        if: steps.diff.outputs.ahead != '0'
        env:
          LATEST: ${{ steps.diff.outputs.latest }}
        run: |
          title="chore(promote): $SOURCE → $TARGET${LATEST:+ ($LATEST)}"
          pr=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open --json number -q '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file pr-body.md
          else
            gh pr create --base "$TARGET" --head "$SOURCE" --title "$title" --body-file pr-body.md
            pr=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open --json number -q '.[0].number')
          fi
          echo "PR #$pr: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.auto_merge }}" = "true" ]; then
            # Merge commit (not squash) keeps branch ancestry so tags stay reachable.
            gh pr merge "$pr" --auto --merge
          fi
