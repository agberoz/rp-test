# Environment pipelines:
#   push staging -> record release -> PR staging -> preprod (tags in description, needs approval)
#   push preprod -> record release -> PR preprod -> prod    (tags in description, needs approval)
#   push prod    -> record release
name: pipeline

on:
  push:
    branches: [staging, preprod, prod]

concurrency:
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write


jobs:

  release:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.version.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo untagged)
          if [ "$tag" = untagged ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          else
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record release
        env:
          ENVIRONMENT: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: echo "\`$VERSION\` is now on **$ENVIRONMENT**" >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: release
    if: github.ref_name != 'prod'
    uses: ./.github/workflows/_promote.yml
    with:
      source: ${{ github.ref_name }}
      target: ${{ github.ref_name == 'staging' && 'preprod' || 'prod' }}
    secrets: inherit
